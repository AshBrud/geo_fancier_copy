<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GeoFoncier NGOGOM_UAD - Systeme d'Information Geographique">
  <defs>
    <clipPath id="roundedIcon">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <radialGradient id="pinGlow" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00c4d8"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#0b1c6f" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#roundedIcon)">
    <rect width="64" height="64" fill="#ffffff"/>
    <image href="logo_uadb.jpg" x="-6" y="-6" width="76" height="76" preserveAspectRatio="xMidYMid slice"/>
    <rect width="64" height="64" fill="#ffffff" opacity="0.08"/>
  </g>

  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(30,58,138,0.18)" stroke-width="1"/>

  <circle cx="32" cy="24" r="16" fill="url(#pinGlow)"/>

  <path d="M32 8.5 C24.5 8.5 18.5 14.5 18.5 22
           C18.5 32.8 32 55.5 32 55.5
           C32 55.5 45.5 32.8 45.5 22
           C45.5 14.5 39.5 8.5 32 8.5Z"
        fill="white" opacity="0.95" filter="url(#softShadow)"/>

  <circle cx="32" cy="22" r="8.5" fill="url(#dotG)" filter="url(#glow)"/>

  <g stroke="#0b1c6f" stroke-width="1.7" stroke-linecap="round" opacity="0.88">
    <line x1="32" y1="15.5" x2="32" y2="19"/>
    <line x1="32" y1="25" x2="32" y2="28.5"/>
    <line x1="25.5" y1="22" x2="29" y2="22"/>
    <line x1="35" y1="22" x2="38.5" y2="22"/>
  </g>

  <circle cx="32" cy="22" r="2.2" fill="#0b1c6f" opacity="0.88"/>
</svg>
