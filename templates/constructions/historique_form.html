{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }}{% endblock %}
{% block breadcrumb %}
<li class="breadcrumb-item"><a href="{% url 'constructions:historique' %}">Historique</a></li>
<li class="breadcrumb-item active">{{ action }}</li>
{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title"><i class="bi bi-clock-history"></i> {{ action }}</h1></div>
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="form-card"><form method="post" novalidate>{% csrf_token %}{% crispy form %}</form></div>
</div></div>
{% endblock %}
