{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Ajouter une orthophoto{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title"><i class="bi bi-images"></i> Ajouter une orthophoto</h1>
  <small class="text-muted">Mission : {{ mission.nom }}</small>
</div>
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="form-card">
      <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}{% crispy form %}</form>
    </div>
  </div>
</div>
{% endblock %}
